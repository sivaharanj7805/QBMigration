# ============================================================================
# NGINX Configuration for QB Migration Server
# ============================================================================
# This configuration is for running nginx as a reverse proxy in front of
# Gunicorn. This is optional - you can also use an AWS Application Load
# Balancer (ALB) directly.
#
# Installation (Ubuntu):
#   sudo apt-get install nginx
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/qbmigration
#   sudo ln -s /etc/nginx/sites-available/qbmigration /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
# ============================================================================

# SECURITY FIX: Rate limiting zones to prevent brute force attacks
# - auth: 10 requests/minute for authentication endpoints
# - general: 100 requests/second for general API access
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=100r/s;

upstream qbmigration {
    # Gunicorn socket (use Unix socket for better performance)
    # server unix:/opt/qbmigration/gunicorn.sock fail_timeout=0;

    # Or TCP socket
    server 127.0.0.1:5000 fail_timeout=0;

    # For multiple instances (load balancing)
    # server 127.0.0.1:5001 fail_timeout=0;
    # server 127.0.0.1:5002 fail_timeout=0;

    keepalive 32;
}

server {
    listen 80;
    server_name your-domain.com;

    # AUDIT FIX CRIT-02: Enforce HTTPS redirect in production
    return 301 https://$server_name$request_uri;

    # SECURITY FIX: Rate limiting for authentication endpoints (10 req/min)
    location /api/auth {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://qbmigration;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/login {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://qbmigration;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # For development/testing, proxy to Gunicorn
    location / {
        # SECURITY FIX: Apply general rate limiting
        limit_req zone=general burst=50 nodelay;

        proxy_pass http://qbmigration;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (for real-time updates)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts (important for file uploads)
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Buffering
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Health check endpoint (for ALB)
    location /api/health {
        proxy_pass http://qbmigration;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Don't log health checks
        access_log off;
    }

    # File upload endpoint (larger body size)
    location /api/upload {
        proxy_pass http://qbmigration;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow large file uploads (50MB default, adjust as needed)
        client_max_body_size 50M;

        # Longer timeouts for uploads
        proxy_connect_timeout 300s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Static files (if any)
    location /static {
        alias /opt/qbmigration/static;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    # FIX: X-XSS-Protection deprecated in modern browsers; use 0 per OWASP guidance
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SECURITY FIX: Add HSTS header (only enable in production with HTTPS)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # FIX: CSP is now managed exclusively by the Flask application (app.py)
    # to prevent conflicts between Nginx and Flask CSP headers. When both
    # set CSP, browsers enforce the most restrictive, which can break
    # Stripe payments and Google reCAPTCHA.
    # DO NOT add a Content-Security-Policy header here.

    # SECURITY FIX: Add Permissions-Policy
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
}

# AUDIT FIX CRIT-02: HTTPS server enabled for production
server {
    listen 443 ssl http2;
    server_name your-domain.com;

    # SSL certificates (use Let's Encrypt in production)
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    # SSL configuration (strong defaults)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # AUDIT FIX CRIT-02: Enable HSTS
    # FIX: Added preload directive for HSTS preload list submission
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    # FIX: X-XSS-Protection deprecated in modern browsers; use 0 per OWASP guidance
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

    # FIX: CSP is now managed exclusively by the Flask application (app.py)
    # to prevent conflicts. See HTTP server block comment for details.
    # DO NOT add a Content-Security-Policy header here.

    # Rate limiting
    location /api/auth {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://qbmigration;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/login {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://qbmigration;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=general burst=50 nodelay;
        proxy_pass http://qbmigration;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location /api/health {
        proxy_pass http://qbmigration;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    location /api/upload {
        proxy_pass http://qbmigration;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
        proxy_connect_timeout 300s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location /static {
        alias /opt/qbmigration/static;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
