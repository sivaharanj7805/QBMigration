name: Build ForensicBridge Installer

# Trigger on push to main, tags, or manual dispatch
on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release'
        required: false
        default: 'true'
        type: boolean

jobs:
  build:
    name: Build & Package
    runs-on: windows-latest

    steps:
    # 1. Checkout Code
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Setup .NET
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # 3. Setup MSBuild for .NET Framework
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # 4. Restore NuGet packages
    - name: Restore Dependencies
      run: |
        dotnet restore ForensicBridgeInstaller/ForensicBridgeInstaller.csproj

    # 5. Build the application
    - name: Build Application
      run: |
        dotnet build ForensicBridgeInstaller/ForensicBridgeInstaller.csproj --configuration Release --no-restore
        dotnet publish ForensicBridgeInstaller/ForensicBridgeInstaller.csproj --configuration Release --no-build --output ForensicBridgeInstaller/publish

    # 6. List build output
    - name: List Build Output
      run: |
        Write-Host "=== Build output ==="
        Get-ChildItem -Path "ForensicBridgeInstaller/publish" -Recurse | Select-Object FullName

    # 7. Compile Installer using Inno Setup
    - name: Compile Installer
      uses: Minionguyjosh/INNO-Setup-Action@v1.2.2
      with:
        path: ForensicBridgeInstaller/ForensicBridge.iss

    # 8. List installer output
    - name: Verify Installer Output
      run: |
        Write-Host "=== Installer output ==="
        Get-ChildItem -Path "ForensicBridgeInstaller/Output" -Recurse | Select-Object FullName, Length

    # 9. Upload the Result as Artifact
    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ForensicBridge-Setup
        path: ForensicBridgeInstaller/Output/ForensicBridge-Setup.exe
        if-no-files-found: error

    # 10. Prepare Release Asset
    - name: Prepare Release Asset
      run: |
        Copy-Item "ForensicBridgeInstaller/Output/ForensicBridge-Setup.exe" "ForensicBridge_Setup.exe"
        Write-Host "Release asset prepared: ForensicBridge_Setup.exe"
        Get-Item "ForensicBridge_Setup.exe" | Select-Object Name, Length

    # 11. Create GitHub Release
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true) || github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', github.run_number) }}
        name: ForensicBridge ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Build {0}', github.run_number) }}
        body: |
          ## ForensicBridge Windows Extractor

          Download the installer below to extract data from QuickBooks Desktop.

          ### Requirements
          - Windows 10 or later
          - QuickBooks Desktop installed
          - Administrator privileges

          ### Installation
          1. Download `ForensicBridge_Setup.exe`
          2. Run the installer as Administrator
          3. Follow the setup wizard
          4. Enter your Session Code when prompted

          ### Usage
          1. Open ForensicBridge from the Start Menu
          2. Enter the Session Code from your migration project
          3. Click "Validate Session"
          4. Click "Start Extraction" to begin the data migration

          ### Notes
          - Make sure QuickBooks Desktop is installed and accessible
          - The QuickBooks SDK (QBFC16) is required for full functionality
          - You may need to authorize ForensicBridge in QuickBooks when prompted
        files: ForensicBridge_Setup.exe
        draft: false
        prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
        make_latest: ${{ startsWith(github.ref, 'refs/tags/') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
