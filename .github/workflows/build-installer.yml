name: Build ForensicBridge Installer & Extractor

# Trigger on push to main, tags, or manual dispatch
on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release'
        required: false
        default: 'true'
        type: boolean

jobs:
  build-extractor:
    name: Build QBExtractor
    runs-on: windows-latest

    steps:
    # 1. Checkout Code
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Setup .NET (net48 needs MSBuild, but dotnet SDK can restore)
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # 3. Setup MSBuild (needed for net48 builds)
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # 4. Install QBFC16 SDK (required for COM reference)
    - name: Check QBFC16 COM Registration
      run: |
        Write-Host "Checking for QBFC16 COM registration..."
        $qbfc = Get-ItemProperty -Path "HKLM:\SOFTWARE\Classes\CLSID\{4EADF8C9-0D1E-4F68-83D6-3F9F0E6FE0FE}" -ErrorAction SilentlyContinue
        if ($qbfc) {
          Write-Host "QBFC16 COM is registered"
        } else {
          Write-Host "QBFC16 COM not found - build may use embedded interop types"
          Write-Host "Note: The QBFC16 SDK must be installed on the build machine for full COM support."
          Write-Host "Download from: https://developer.intuit.com/app/developer/qbdesktop/docs/develop/sdks-and-samples-for-qb-desktop"
        }

    # 5. Restore NuGet packages for QBDesktopReader
    - name: Restore QBDesktopReader Dependencies
      run: |
        dotnet restore QBDesktopReader/QBDesktopReader.csproj

    # 6. Build QBDesktopReader (produces QBExtractor.exe)
    # HIGH-12 FIX: Removed continue-on-error to prevent releasing broken binaries
    - name: Build QBDesktopReader
      run: |
        dotnet build QBDesktopReader/QBDesktopReader.csproj --configuration Release --no-restore

    # 7. Publish QBExtractor as self-contained single-file exe
    - name: Publish QBExtractor
      run: |
        dotnet publish QBDesktopReader/QBDesktopReader.csproj `
          --configuration Release `
          --runtime win-x86 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:EnableCompressionInSingleFile=true `
          --output QBDesktopReader/publish

    # 8. Verify QBExtractor output
    - name: Verify QBExtractor Build
      id: verify_extractor
      run: |
        $exePath = "QBDesktopReader/publish/QBExtractor.exe"
        if (Test-Path $exePath) {
          $size = (Get-Item $exePath).Length
          Write-Host "QBExtractor.exe: $size bytes"
          echo "extractor_built=true" >> $env:GITHUB_OUTPUT
        } else {
          Write-Host "WARNING: QBExtractor.exe not found in publish output"
          Write-Host "This is expected if QBFC16 SDK is not installed on the build machine."
          Write-Host "Listing available files:"
          Get-ChildItem -Path "QBDesktopReader/publish" -Recurse -ErrorAction SilentlyContinue | Select-Object FullName, Length
          echo "extractor_built=false" >> $env:GITHUB_OUTPUT
        }

    # 9. Code sign QBExtractor (ADV-01: Code signing for .exe files)
    - name: Sign QBExtractor
      if: steps.verify_extractor.outputs.extractor_built == 'true' && secrets.CODE_SIGNING_CERT_BASE64 != ''
      env:
        CODE_SIGNING_CERT: ${{ secrets.CODE_SIGNING_CERT_BASE64 }}
        CODE_SIGNING_PASSWORD: ${{ secrets.CODE_SIGNING_CERT_PASSWORD }}
      run: |
        $certPath = "$env:RUNNER_TEMP\code_signing.pfx"
        try {
          # Decode certificate from GitHub Secrets
          $certBytes = [Convert]::FromBase64String($env:CODE_SIGNING_CERT)
          [IO.File]::WriteAllBytes($certPath, $certBytes)

          # Sign QBExtractor.exe with Authenticode
          & signtool sign /f $certPath /p $env:CODE_SIGNING_PASSWORD `
            /tr https://timestamp.digicert.com /td sha256 /fd sha256 `
            /d "ForensicBridge QBExtractor" `
            "QBDesktopReader/publish/QBExtractor.exe"

          # Verify signature
          & signtool verify /pa "QBDesktopReader/publish/QBExtractor.exe"
        }
        finally {
          # Secure cleanup even on failure
          if (Test-Path $certPath) { Remove-Item $certPath -Force }
        }

    # 10. Upload QBExtractor artifact
    - name: Upload QBExtractor Artifact
      if: steps.verify_extractor.outputs.extractor_built == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: QBExtractor
        path: QBDesktopReader/publish/QBExtractor.exe
        if-no-files-found: warn

  build-launcher:
    name: Build Launcher & Package
    runs-on: windows-latest

    steps:
    # 1. Checkout Code
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Setup .NET
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # 3. Setup MSBuild
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # 4. Restore NuGet packages
    - name: Restore Dependencies
      run: |
        dotnet restore ForensicBridgeInstaller/ForensicBridgeInstaller.csproj

    # 5. Build the launcher application
    - name: Build Launcher
      run: |
        dotnet build ForensicBridgeInstaller/ForensicBridgeInstaller.csproj --configuration Release --no-restore

    # 6. Publish self-contained for Inno Setup installer
    - name: Publish for Installer
      run: |
        dotnet publish ForensicBridgeInstaller/ForensicBridgeInstaller.csproj `
          --configuration Release `
          --runtime win-x86 `
          --self-contained true `
          --output ForensicBridgeInstaller/publish

    # 7. Publish single-file standalone exe
    - name: Publish Standalone Launcher
      run: |
        dotnet publish ForensicBridgeInstaller/ForensicBridgeInstaller.csproj `
          --configuration Release `
          --runtime win-x86 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:EnableCompressionInSingleFile=true `
          --output ForensicBridgeInstaller/standalone

    # 8. List build output
    - name: List Build Output
      run: |
        Write-Host "=== Launcher publish output ==="
        Get-ChildItem -Path "ForensicBridgeInstaller/publish" -Recurse | Select-Object FullName, Length
        Write-Host ""
        Write-Host "=== Standalone launcher output ==="
        Get-ChildItem -Path "ForensicBridgeInstaller/standalone" -Recurse | Select-Object FullName, Length

    # 9. Compile Installer using Inno Setup
    - name: Compile Installer
      uses: Minionguyjpro/Inno-Setup-Action@b8e8eb5936437c243592fda645c96dfc6488c275 # v1.2.2
      with:
        path: ForensicBridgeInstaller/ForensicBridge.iss

    # 10. Verify outputs
    - name: Verify Outputs
      run: |
        Write-Host "=== Inno Setup installer ==="
        Get-ChildItem -Path "ForensicBridgeInstaller/Output" -Recurse | Select-Object FullName, Length
        Write-Host ""
        Write-Host "=== Standalone launcher ==="
        $exe = Get-Item "ForensicBridgeInstaller/standalone/ForensicBridge.exe" -ErrorAction SilentlyContinue
        if ($exe) {
          Write-Host "ForensicBridge.exe (launcher): $($exe.Length) bytes"
        } else {
          Write-Host "WARNING: Standalone launcher not found"
        }

    # 11. Code sign installer and launcher (ADV-01: Code signing for .exe files)
    - name: Sign Installer and Launcher
      if: secrets.CODE_SIGNING_CERT_BASE64 != ''
      env:
        CODE_SIGNING_CERT: ${{ secrets.CODE_SIGNING_CERT_BASE64 }}
        CODE_SIGNING_PASSWORD: ${{ secrets.CODE_SIGNING_CERT_PASSWORD }}
      run: |
        $certPath = "$env:RUNNER_TEMP\code_signing.pfx"
        try {
          $certBytes = [Convert]::FromBase64String($env:CODE_SIGNING_CERT)
          [IO.File]::WriteAllBytes($certPath, $certBytes)

          # Sign installer
          if (Test-Path "ForensicBridgeInstaller/Output/ForensicBridge-Setup.exe") {
            & signtool sign /f $certPath /p $env:CODE_SIGNING_PASSWORD `
              /tr https://timestamp.digicert.com /td sha256 /fd sha256 `
              /d "ForensicBridge Setup" `
              "ForensicBridgeInstaller/Output/ForensicBridge-Setup.exe"
            & signtool verify /pa "ForensicBridgeInstaller/Output/ForensicBridge-Setup.exe"
          }

          # Sign standalone launcher
          if (Test-Path "ForensicBridgeInstaller/standalone/ForensicBridge.exe") {
            & signtool sign /f $certPath /p $env:CODE_SIGNING_PASSWORD `
              /tr https://timestamp.digicert.com /td sha256 /fd sha256 `
              /d "ForensicBridge Launcher" `
              "ForensicBridgeInstaller/standalone/ForensicBridge.exe"
            & signtool verify /pa "ForensicBridgeInstaller/standalone/ForensicBridge.exe"
          }
        }
        finally {
          # Secure cleanup even on failure
          if (Test-Path $certPath) { Remove-Item $certPath -Force }
        }

    # 12. Upload artifacts
    - name: Upload Setup Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ForensicBridge-Setup
        path: ForensicBridgeInstaller/Output/ForensicBridge-Setup.exe
        if-no-files-found: error

    - name: Upload Standalone Launcher Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ForensicBridge-Launcher
        path: ForensicBridgeInstaller/standalone/ForensicBridge.exe
        if-no-files-found: warn

  release:
    name: Create Release
    needs: [build-extractor, build-launcher]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true) || github.ref == 'refs/heads/main'

    steps:
    - name: Download All Artifacts
      uses: actions/download-artifact@v4
      with:
        path: release-assets

    - name: Prepare Release Assets
      run: |
        echo "=== Downloaded artifacts ==="
        find release-assets -type f -ls

        # Copy launcher assets
        if [ -f "release-assets/ForensicBridge-Setup/ForensicBridge-Setup.exe" ]; then
          cp "release-assets/ForensicBridge-Setup/ForensicBridge-Setup.exe" "ForensicBridge_Setup.exe"
          echo "Launcher Setup installer prepared"
        fi

        if [ -f "release-assets/ForensicBridge-Launcher/ForensicBridge.exe" ]; then
          cp "release-assets/ForensicBridge-Launcher/ForensicBridge.exe" "ForensicBridge_Launcher.exe"
          echo "Standalone launcher prepared"
        fi

        # Copy extractor
        if [ -f "release-assets/QBExtractor/QBExtractor.exe" ]; then
          cp "release-assets/QBExtractor/QBExtractor.exe" "QBExtractor.exe"
          echo "QBExtractor.exe prepared"
        else
          echo "WARNING: QBExtractor.exe not available (QBFC16 SDK may not be on build machine)"
        fi

    # AUDIT FIX HIGH-13: Generate SHA256 checksums for cryptographic verification
    - name: Generate SHA256 Checksums
      run: |
        echo "=== Generating SHA256 checksums ==="
        sha256sum *.exe > SHA256SUMS.txt 2>/dev/null || true
        if [ -s SHA256SUMS.txt ]; then
          echo "Checksums generated:"
          cat SHA256SUMS.txt
        else
          echo "No artifacts to checksum"
        fi

    - name: Create GitHub Release
      uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', github.run_number) }}
        name: ForensicBridge ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Build {0}', github.run_number) }}
        body: |
          ## ForensicBridge QuickBooks Desktop Migration

          ### Downloads
          - **QBExtractor.exe** - QuickBooks Desktop data extractor (the real extraction engine)
          - **ForensicBridge_Setup.exe** - GUI launcher with installer (recommended for end users)
          - **ForensicBridge_Launcher.exe** - Standalone GUI launcher (no installation, downloads QBExtractor automatically)

          ### Requirements
          - Windows 10 or later
          - QuickBooks Desktop installed and running with a company file open
          - QuickBooks SDK (QBFC16) installed

          ### Quick Start
          1. Download `QBExtractor.exe` (or `ForensicBridge_Setup.exe` for the GUI launcher)
          2. Run the application
          3. Enter your Session Code from the migration portal
          4. Authorize access in QuickBooks when prompted
          5. Data is extracted, encrypted with AES-256-GCM, and uploaded securely

          ### What It Does
          - Connects to QuickBooks Desktop via QBFC16 COM SDK
          - Extracts all financial data (customers, invoices, vendors, bills, accounts, etc.)
          - Sanitizes and validates data with forensic hashing
          - Encrypts with AES-256-GCM chunked encryption
          - Uploads securely to ForensicBridge for migration
        files: |
          QBExtractor.exe
          ForensicBridge_Setup.exe
          ForensicBridge_Launcher.exe
          SHA256SUMS.txt
        fail-on-unmatched-files: false
        draft: false
        prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
        make_latest: ${{ startsWith(github.ref, 'refs/tags/') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
