# ============================================================================
# NGINX Configuration for QB Migration Server
# ============================================================================
# This configuration is for running nginx as a reverse proxy in front of
# Gunicorn. This is optional - you can also use an AWS Application Load
# Balancer (ALB) directly.
#
# Installation (Ubuntu):
#   sudo apt-get install nginx
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/qbmigration
#   sudo ln -s /etc/nginx/sites-available/qbmigration /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
# ============================================================================

# SECURITY FIX: Rate limiting zones to prevent brute force attacks
# - auth: 10 requests/minute for authentication endpoints
# - general: 100 requests/second for general API access
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=100r/s;

upstream qbmigration {
    # Gunicorn socket (use Unix socket for better performance)
    # server unix:/opt/qbmigration/gunicorn.sock fail_timeout=0;

    # Or TCP socket
    server 127.0.0.1:5000 fail_timeout=0;

    # For multiple instances (load balancing)
    # server 127.0.0.1:5001 fail_timeout=0;
    # server 127.0.0.1:5002 fail_timeout=0;

    keepalive 32;
}

server {
    listen 80;
    server_name your-domain.com;

    # Redirect HTTP to HTTPS (uncomment in production)
    # return 301 https://$server_name$request_uri;

    # SECURITY FIX: Rate limiting for authentication endpoints (10 req/min)
    location /api/auth {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://qbmigration;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/login {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://qbmigration;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # For development/testing, proxy to Gunicorn
    location / {
        # SECURITY FIX: Apply general rate limiting
        limit_req zone=general burst=50 nodelay;

        proxy_pass http://qbmigration;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (for real-time updates)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts (important for file uploads)
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Buffering
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Health check endpoint (for ALB)
    location /api/health {
        proxy_pass http://qbmigration;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Don't log health checks
        access_log off;
    }

    # File upload endpoint (larger body size)
    location /api/upload {
        proxy_pass http://qbmigration;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow large file uploads (50MB default, adjust as needed)
        client_max_body_size 50M;

        # Longer timeouts for uploads
        proxy_connect_timeout 300s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Static files (if any)
    location /static {
        alias /opt/qbmigration/static;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SECURITY FIX: Add HSTS header (only enable in production with HTTPS)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # SECURITY FIX: Content-Security-Policy
    # NOTE: 'unsafe-inline' and 'unsafe-eval' are used for development/compatibility.
    # For production, remove these and use nonces or hashes for inline scripts/styles:
    # script-src 'self' 'nonce-{RANDOM}'; style-src 'self' 'nonce-{RANDOM}'
    # The frontend must then add nonce="{RANDOM}" to all inline script/style tags.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.quickbooks.com https://*.intuit.com; frame-ancestors 'self'; form-action 'self'; base-uri 'self';" always;

    # SECURITY FIX: Add Permissions-Policy
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
}

