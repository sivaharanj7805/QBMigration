[mypy]
python_version = 3.11
ignore_missing_imports = True
no_implicit_optional = False
disable_error_code = import-untyped

# ── Staged typing cleanup ──────────────────────────────────────────
# The modules below have complex dict/union patterns that need
# incremental typing work. Errors are ignored here and should be
# progressively re-enabled as proper type annotations are added.
#
# To check a module's readiness, run:
#   mypy QBMigrationService/<module>.py --ignore-missing-imports
# and fix any remaining errors before removing its ignore rule.

[mypy-QBMigrationService.data_transformer]
ignore_errors = True

[mypy-QBMigrationService.verifier]
ignore_errors = True

[mypy-QBMigrationService.qbo_client]
ignore_errors = True

[mypy-QBMigrationService.security]
ignore_errors = True

