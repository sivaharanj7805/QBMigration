name: Python CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort

    - name: Check formatting with Black
      run: |
        black --check --diff QBMigrationServer/ QBMigrationService/

    - name: Check import sorting with isort
      run: |
        isort --check-only --diff --profile black QBMigrationServer/ QBMigrationService/

    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 QBMigrationServer/ QBMigrationService/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Enforce complexity and line length limits
        flake8 QBMigrationServer/ QBMigrationService/ --count --max-complexity=15 --max-line-length=120 --statistics

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety

    - name: Run Bandit security scan
      run: |
        # Generate JSON report for artifact upload (exclude test dirs)
        bandit -r QBMigrationServer/ QBMigrationService/ --exclude QBMigrationServer/tests,QBMigrationService/tests -f json -o bandit-report.json || true
        # AUDIT FIX P1-08: Re-enabled B105/B107 (hardcoded passwords).
        # False positives should use inline # nosec B105 comments instead.
        # Only B101 (assert in guard clauses) and B110 (graceful degradation) skipped.
        #   B101: assert_used - used in production guard clauses for fail-fast
        #   B110: try_except_pass - used for graceful degradation in optional features
        bandit -r QBMigrationServer/ QBMigrationService/ \
          --exclude QBMigrationServer/tests,QBMigrationService/tests \
          --skip B101,B110 \
          -ll -ii

    - name: Upload Bandit Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: bandit-security-report
        path: bandit-report.json

  test-server:
    name: Test Backend Server
    runs-on: ubuntu-latest
    needs: [lint]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: qbmigration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r QBMigrationServer/requirements.txt
        pip install pytest pytest-cov pytest-asyncio

    - name: Run Server Tests
      env:
        DATABASE_URL: postgresql://testuser:testpass@localhost:5432/qbmigration_test
        SECRET_KEY: ${{ secrets.TEST_SECRET_KEY }}
        FLASK_ENV: testing
        WEBHOOK_SECRET: ${{ secrets.TEST_WEBHOOK_SECRET }}
        BACKUP_ENCRYPTION_KEY: ${{ secrets.TEST_BACKUP_ENCRYPTION_KEY }}
        PYTHONPATH: ${{ github.workspace }}/QBMigrationServer
      run: |
        cd QBMigrationServer
        pytest tests/ -v --cov=. --cov-report=xml --cov-report=term-missing

    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: server-coverage-report
        path: QBMigrationServer/coverage.xml

  test-service:
    name: Test Migration Service
    runs-on: ubuntu-latest
    needs: [lint]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r QBMigrationService/requirements.txt
        pip install pytest pytest-cov

    - name: Run Service Tests
      env:
        PYTHONPATH: ${{ github.workspace }}/QBMigrationService
      run: |
        cd QBMigrationService
        pytest tests/ -v --cov=. --cov-report=xml --cov-report=term-missing

    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: service-coverage-report
        path: QBMigrationService/coverage.xml

  type-check:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install mypy
      run: |
        python -m pip install --upgrade pip
        pip install mypy types-requests types-flask

    - name: Run mypy
      run: |
        mypy QBMigrationServer/ QBMigrationService/ --ignore-missing-imports

  # ADV-05: SBOM (Software Bill of Materials) generation
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install SBOM tools
      run: |
        python -m pip install --upgrade pip
        pip install cyclonedx-bom

    - name: Install project dependencies
      run: |
        pip install -r QBMigrationServer/requirements.txt
        pip install -r QBMigrationService/requirements.txt

    - name: Generate Python SBOM (CycloneDX)
      run: |
        cyclonedx-py environment \
          --output sbom-python.json \
          --output-format json \
          --schema-version 1.5

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Generate Frontend SBOM
      run: |
        cd forensicbridge-dashboard
        npm ci --ignore-scripts
        npx @cyclonedx/cyclonedx-npm --output-file ../sbom-frontend.json --output-format JSON || true
        cd ..

    - name: Upload SBOM Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: sbom-artifacts
        path: |
          sbom-python.json
          sbom-frontend.json
        if-no-files-found: warn
