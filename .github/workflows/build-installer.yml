name: Build ForensicBridge Installer & Extractor

# Trigger on push to main, tags, or manual dispatch
on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release'
        required: false
        default: 'true'
        type: boolean

jobs:
  build-extractor:
    name: Build QBExtractor
    runs-on: windows-latest

    steps:
    # 1. Checkout Code
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Setup .NET
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # 3. Setup MSBuild (needed for net48 builds)
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # 4. Check QBFC16 COM registration
    - name: Check QBFC16 COM Registration
      run: |
        Write-Host "Checking for QBFC16 COM registration..."
        $qbfc = Get-ItemProperty -Path "HKLM:\SOFTWARE\Classes\CLSID\{4EADF8C9-0D1E-4F68-83D6-3F9F0E6FE0FE}" -ErrorAction SilentlyContinue
        if ($qbfc) {
          Write-Host "QBFC16 COM is registered"
        } else {
          Write-Host "QBFC16 COM not found - build requires QBFC16 SDK installed."
          Write-Host "Download from: https://developer.intuit.com/app/developer/qbdesktop/docs/develop/sdks-and-samples-for-qb-desktop"
          Write-Host ""
          Write-Host "To build QBExtractor, use a self-hosted runner with QBFC16 installed,"
          Write-Host "or build locally with: dotnet publish QBDesktopReader/QBDesktopReader.csproj -c Release -r win-x86 -o publish"
        }

    # 5. Restore NuGet packages
    - name: Restore QBDesktopReader Dependencies
      run: dotnet restore QBDesktopReader/QBDesktopReader.csproj
      continue-on-error: true

    # 6. Publish QBDesktopReader (net48 produces a folder, NOT a single file)
    # NOTE: net48 does not support PublishSingleFile or --self-contained.
    # The output is a folder with QBExtractor.exe + DLLs + config.json.
    # We zip this folder for distribution.
    - name: Publish QBExtractor
      run: |
        dotnet publish QBDesktopReader/QBDesktopReader.csproj `
          --configuration Release `
          --runtime win-x86 `
          --output QBDesktopReader/publish
      continue-on-error: true

    # 7. Verify and zip the publish output
    - name: Package QBExtractor
      id: verify_extractor
      run: |
        $publishDir = "QBDesktopReader/publish"
        $exePath = "$publishDir/QBExtractor.exe"

        if (Test-Path $exePath) {
          $size = (Get-Item $exePath).Length
          Write-Host "QBExtractor.exe: $size bytes"

          # List all files that will be in the zip
          Write-Host ""
          Write-Host "=== Package contents ==="
          Get-ChildItem -Path $publishDir -Recurse | Select-Object FullName, Length

          # Verify config.json is included
          if (Test-Path "$publishDir/config.json") {
            Write-Host ""
            Write-Host "config.json: present"
          } else {
            Write-Host ""
            Write-Host "WARNING: config.json not found in publish output"
          }

          # Create zip containing the entire publish folder contents
          Compress-Archive -Path "$publishDir/*" -DestinationPath "QBExtractor.zip" -Force
          $zipSize = (Get-Item "QBExtractor.zip").Length
          Write-Host ""
          Write-Host "QBExtractor.zip: $zipSize bytes"
          echo "extractor_built=true" >> $env:GITHUB_OUTPUT
        } else {
          Write-Host "WARNING: QBExtractor.exe not found in publish output"
          Write-Host "This is expected if QBFC16 SDK is not installed on the build machine."
          Write-Host ""
          Write-Host "Available files:"
          Get-ChildItem -Path $publishDir -Recurse -ErrorAction SilentlyContinue | Select-Object FullName, Length
          echo "extractor_built=false" >> $env:GITHUB_OUTPUT
        }

    # 8. Upload QBExtractor.zip artifact
    - name: Upload QBExtractor Artifact
      if: steps.verify_extractor.outputs.extractor_built == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: QBExtractor
        path: QBExtractor.zip
        if-no-files-found: warn

  build-launcher:
    name: Build Launcher & Package
    runs-on: windows-latest

    steps:
    # 1. Checkout Code
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Setup .NET
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # 3. Setup MSBuild
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # 4. Restore NuGet packages
    - name: Restore Dependencies
      run: dotnet restore ForensicBridgeInstaller/ForensicBridgeInstaller.csproj

    # 5. Build the launcher application
    - name: Build Launcher
      run: dotnet build ForensicBridgeInstaller/ForensicBridgeInstaller.csproj --configuration Release --no-restore

    # 6. Publish for Inno Setup installer
    # NOTE: net48 does not support PublishSingleFile or --self-contained
    - name: Publish for Installer
      run: |
        dotnet publish ForensicBridgeInstaller/ForensicBridgeInstaller.csproj `
          --configuration Release `
          --runtime win-x86 `
          --output ForensicBridgeInstaller/publish

    # 7. List build output
    - name: List Build Output
      run: |
        Write-Host "=== Launcher publish output ==="
        Get-ChildItem -Path "ForensicBridgeInstaller/publish" -Recurse | Select-Object FullName, Length

    # 8. Compile Installer using Inno Setup
    - name: Compile Installer
      uses: Minionguyjosh/INNO-Setup-Action@v1.2.2
      with:
        path: ForensicBridgeInstaller/ForensicBridge.iss

    # 9. Verify outputs
    - name: Verify Outputs
      run: |
        Write-Host "=== Inno Setup installer ==="
        Get-ChildItem -Path "ForensicBridgeInstaller/Output" -Recurse | Select-Object FullName, Length

    # 10. Upload Setup Installer artifact
    - name: Upload Setup Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ForensicBridge-Setup
        path: ForensicBridgeInstaller/Output/ForensicBridge-Setup.exe
        if-no-files-found: error

  release:
    name: Create Release
    needs: [build-extractor, build-launcher]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true) || github.ref == 'refs/heads/main'

    steps:
    - name: Download All Artifacts
      uses: actions/download-artifact@v4
      with:
        path: release-assets

    - name: Prepare Release Assets
      run: |
        echo "=== Downloaded artifacts ==="
        find release-assets -type f -ls

        # Copy launcher Setup installer
        if [ -f "release-assets/ForensicBridge-Setup/ForensicBridge-Setup.exe" ]; then
          cp "release-assets/ForensicBridge-Setup/ForensicBridge-Setup.exe" "ForensicBridge_Setup.exe"
          echo "Launcher Setup installer prepared"
        fi

        # Copy extractor zip (contains exe + DLLs + config.json)
        if [ -f "release-assets/QBExtractor/QBExtractor.zip" ]; then
          cp "release-assets/QBExtractor/QBExtractor.zip" "QBExtractor.zip"
          echo "QBExtractor.zip prepared"
        else
          echo "WARNING: QBExtractor.zip not available (QBFC16 SDK may not be on build machine)"
        fi

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', github.run_number) }}
        name: ForensicBridge ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Build {0}', github.run_number) }}
        body: |
          ## ForensicBridge QuickBooks Desktop Migration

          ### Downloads
          - **QBExtractor.zip** - QuickBooks data extractor package (exe + DLLs + config)
          - **ForensicBridge_Setup.exe** - GUI launcher installer (recommended for end users)

          ### Installation
          **Option A: GUI Launcher (Recommended)**
          1. Download and run `ForensicBridge_Setup.exe`
          2. The launcher automatically downloads QBExtractor when needed

          **Option B: Direct Extractor**
          1. Download `QBExtractor.zip`
          2. Extract to a folder (e.g., `C:\ForensicBridge\`)
          3. Run `QBExtractor.exe --session YOUR-SESSION-CODE`

          ### Requirements
          - Windows 10 or later
          - .NET Framework 4.8 (pre-installed on Windows 10+)
          - QuickBooks Desktop installed with a company file open
          - QuickBooks SDK (QBFC16) installed

          ### What It Does
          - Connects to QuickBooks Desktop via QBFC16 COM SDK
          - Extracts all financial data (40+ entity types)
          - Sanitizes data with forensic hashing (SHA-256 per record)
          - Encrypts with AES-256-GCM chunked encryption
          - Uploads securely to ForensicBridge with resume support
        files: |
          QBExtractor.zip
          ForensicBridge_Setup.exe
        fail-on-unmatched-files: false
        draft: false
        prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
        make_latest: ${{ startsWith(github.ref, 'refs/tags/') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
