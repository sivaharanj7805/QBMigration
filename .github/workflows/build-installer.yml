name: Build ForensicBridge Installer

# Trigger on push to main, tags, or manual dispatch
on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release'
        required: false
        default: 'true'
        type: boolean

jobs:
  build:
    name: Build & Package
    runs-on: windows-latest

    steps:
    # 1. Checkout Code
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Setup .NET
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # 3. Setup MSBuild
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # 4. Restore NuGet packages
    - name: Restore Dependencies
      run: |
        dotnet restore ForensicBridgeInstaller/ForensicBridgeInstaller.csproj

    # 5. Build the application
    - name: Build Application
      run: |
        dotnet build ForensicBridgeInstaller/ForensicBridgeInstaller.csproj --configuration Release --no-restore

    # 6. Publish self-contained for Inno Setup installer
    - name: Publish for Installer
      run: |
        dotnet publish ForensicBridgeInstaller/ForensicBridgeInstaller.csproj `
          --configuration Release `
          --runtime win-x86 `
          --self-contained true `
          --output ForensicBridgeInstaller/publish

    # 7. Publish single-file standalone exe
    - name: Publish Standalone Exe
      run: |
        dotnet publish ForensicBridgeInstaller/ForensicBridgeInstaller.csproj `
          --configuration Release `
          --runtime win-x86 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:EnableCompressionInSingleFile=true `
          --output ForensicBridgeInstaller/standalone

    # 8. List build output
    - name: List Build Output
      run: |
        Write-Host "=== Installer publish output ==="
        Get-ChildItem -Path "ForensicBridgeInstaller/publish" -Recurse | Select-Object FullName, Length
        Write-Host ""
        Write-Host "=== Standalone exe output ==="
        Get-ChildItem -Path "ForensicBridgeInstaller/standalone" -Recurse | Select-Object FullName, Length

    # 9. Compile Installer using Inno Setup
    - name: Compile Installer
      uses: Minionguyjosh/INNO-Setup-Action@v1.2.2
      with:
        path: ForensicBridgeInstaller/ForensicBridge.iss

    # 10. Verify outputs
    - name: Verify Outputs
      run: |
        Write-Host "=== Inno Setup installer ==="
        Get-ChildItem -Path "ForensicBridgeInstaller/Output" -Recurse | Select-Object FullName, Length
        Write-Host ""
        Write-Host "=== Standalone exe ==="
        $exe = Get-Item "ForensicBridgeInstaller/standalone/ForensicBridge.exe" -ErrorAction SilentlyContinue
        if ($exe) {
          Write-Host "ForensicBridge.exe: $($exe.Length) bytes"
        } else {
          Write-Host "WARNING: Standalone exe not found"
        }

    # 11. Upload artifacts
    - name: Upload Setup Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ForensicBridge-Setup
        path: ForensicBridgeInstaller/Output/ForensicBridge-Setup.exe
        if-no-files-found: error

    - name: Upload Standalone Exe Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ForensicBridge-Standalone
        path: ForensicBridgeInstaller/standalone/ForensicBridge.exe
        if-no-files-found: warn

    # 12. Prepare Release Assets
    - name: Prepare Release Assets
      run: |
        Copy-Item "ForensicBridgeInstaller/Output/ForensicBridge-Setup.exe" "ForensicBridge_Setup.exe"
        $standalone = "ForensicBridgeInstaller/standalone/ForensicBridge.exe"
        if (Test-Path $standalone) {
          Copy-Item $standalone "ForensicBridge.exe"
          Write-Host "Both release assets prepared"
        } else {
          Write-Host "Only Setup installer prepared (standalone not available)"
        }

    # 13. Create GitHub Release
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true) || github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', github.run_number) }}
        name: ForensicBridge ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Build {0}', github.run_number) }}
        body: |
          ## ForensicBridge Windows Extractor

          Download the installer or standalone executable to extract data from QuickBooks Desktop.

          ### Downloads
          - **ForensicBridge_Setup.exe** - Full installer with Start Menu shortcuts (recommended)
          - **ForensicBridge.exe** - Standalone executable (no installation required)

          ### Requirements
          - Windows 10 or later
          - QuickBooks Desktop installed and running
          - QuickBooks SDK (QBFC16) for data extraction

          ### Quick Start
          1. Download `ForensicBridge_Setup.exe` or `ForensicBridge.exe`
          2. Run the application
          3. Enter your Session Code from the migration project
          4. Click "Validate Session"
          5. Click "Start Extraction"
          6. Authorize ForensicBridge in QuickBooks when prompted

          ### What It Does
          - Connects to QuickBooks Desktop via QBFC16
          - Extracts all financial data (customers, invoices, vendors, bills, etc.)
          - Encrypts data with AES-256-GCM
          - Uploads securely to ForensicBridge for migration
        files: |
          ForensicBridge_Setup.exe
          ForensicBridge.exe
        draft: false
        prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
        make_latest: ${{ startsWith(github.ref, 'refs/tags/') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
