AWSTemplateFormatVersion: '2010-09-09'
Description: 'ForensicBridge - QB Migration Infrastructure (Production-Hardened)'

Parameters:
  Environment:
    Type: String
    Default: production
    AllowedValues: [production, staging]

  # AUDIT FIX CRIT-03: Use Secrets Manager dynamic reference instead of plain parameter
  # DBPassword removed - retrieved from Secrets Manager at runtime
  # Create secret first: aws secretsmanager create-secret --name forensicbridge/production/db --secret-string '{"password":"YOUR_SECURE_PASSWORD"}'

  DomainName:
    Type: String
    Default: api.forensicbridge.io
    Description: Domain for the API server
  
  CertificateArn:
    Type: String
    Default: ''
    Description: ARN of ACM certificate for HTTPS (leave empty to skip HTTPS)
  
  AllowedSSHCidr:
    Type: String
    Default: '10.0.0.0/8'
    Description: CIDR block allowed for SSH access (restrict to VPN/office IP)

  # ADV-04: Alert email for SNS alarm subscriptions
  AlertEmail:
    Type: String
    Default: ''
    Description: Email address for alarm notifications (leave empty to skip subscription)

Conditions:
  HasCertificate: !Not [!Equals [!Ref CertificateArn, '']]
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]

Resources:
  # ============================================================================
  # VPC & NETWORKING
  # ============================================================================
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub forensicbridge-${Environment}-vpc

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub forensicbridge-${Environment}-public-1

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub forensicbridge-${Environment}-public-2

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.10.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub forensicbridge-${Environment}-private-1

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.11.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub forensicbridge-${Environment}-private-2

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # FIX I-02: NAT Gateway for private subnet outbound internet access
  # Required for RDS/ElastiCache in private subnets to reach AWS APIs
  NatGatewayEIP:
    Type: AWS::EC2::EIP
    DependsOn: AttachGateway
    Properties:
      Domain: vpc

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatGatewayEIP.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: !Sub forensicbridge-${Environment}-nat

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub forensicbridge-${Environment}-private-rt

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  # ============================================================================
  # SECURITY GROUPS (HARDENED)
  # ============================================================================
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB Security Group - HTTPS and HTTP (for redirect)
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS from anywhere
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP (redirects to HTTPS)
      Tags:
        - Key: Name
          Value: !Sub forensicbridge-${Environment}-alb-sg

  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: EC2 Instance Security Group - Restricted Access
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5000
          ToPort: 5000
          SourceSecurityGroupId: !Ref ALBSecurityGroup
          Description: Flask app from ALB only
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AllowedSSHCidr
          Description: SSH from VPN/office only
      Tags:
        - Key: Name
          Value: !Sub forensicbridge-${Environment}-ec2-sg

  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS Security Group - Private Access Only
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref EC2SecurityGroup
          Description: PostgreSQL from EC2 only
      Tags:
        - Key: Name
          Value: !Sub forensicbridge-${Environment}-rds-sg

  RedisSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Redis Security Group - Private Access Only
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          SourceSecurityGroupId: !Ref EC2SecurityGroup
          Description: Redis from EC2 only
      Tags:
        - Key: Name
          Value: !Sub forensicbridge-${Environment}-redis-sg

  # ============================================================================
  # AWS WAF (Web Application Firewall)
  # ============================================================================
  WebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub forensicbridge-${Environment}-waf
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub forensicbridge-${Environment}-waf
      Rules:
        - Name: AWSManagedRulesCommonRuleSet
          Priority: 1
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: CommonRuleSetMetric
        - Name: AWSManagedRulesSQLiRuleSet
          Priority: 2
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesSQLiRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: SQLiRuleSetMetric
        - Name: AWSManagedRulesKnownBadInputsRuleSet
          Priority: 3
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: KnownBadInputsMetric
        - Name: RateLimitRule
          Priority: 4
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              # M-18 FIX: Reduced from 2000 to 500 per 5-min window per IP.
              # 2000/5min (400/min) was too permissive for brute force.
              Limit: 500
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: RateLimitMetric
        # FIX AWS-01: Stricter rate limit for authentication endpoints
        - Name: AuthRateLimitRule
          Priority: 5
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: 100
              AggregateKeyType: IP
              ScopeDownStatement:
                OrStatement:
                  Statements:
                    - ByteMatchStatement:
                        FieldToMatch:
                          UriPath: {}
                        PositionalConstraint: STARTS_WITH
                        SearchString: /api/auth
                        TextTransformations:
                          - Priority: 0
                            Type: LOWERCASE
                    - ByteMatchStatement:
                        FieldToMatch:
                          UriPath: {}
                        PositionalConstraint: STARTS_WITH
                        SearchString: /api/login
                        TextTransformations:
                          - Priority: 0
                            Type: LOWERCASE
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: AuthRateLimitMetric

  # ============================================================================
  # KMS KEY FOR ENCRYPTION (FIX AWS-03)
  # ============================================================================
  MigrationEncryptionKey:
    Type: AWS::KMS::Key
    Properties:
      Description: CMK for ForensicBridge migration data encryption
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: Allow S3 Service
            Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:GenerateDataKey*
            Resource: '*'
      Tags:
        - Key: Name
          Value: !Sub forensicbridge-${Environment}-key

  MigrationEncryptionKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/forensicbridge-${Environment}'
      TargetKeyId: !Ref MigrationEncryptionKey

  # ============================================================================
  # S3 BUCKET (Encrypted Migration Data - Hardened)
  # ============================================================================
  MigrationBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub forensicbridge-migrations-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          # FIX AWS-03: Use Customer Managed Key instead of default AES256
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt MigrationEncryptionKey.Arn
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          # AUDIT FIX MED-15: Align lifecycle with LogBucket (365 days) for compliance
          - Id: DeleteOldMigrations
            Status: Enabled
            ExpirationInDays: 365
          - Id: TransitionToGlacier
            Status: Enabled
            Transitions:
              - StorageClass: GLACIER
                TransitionInDays: 30
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['Content-Type', 'Authorization', 'x-amz-date']
            AllowedMethods: [GET, PUT, POST]
            AllowedOrigins:
              # SECURITY FIX: Removed localhost origin from production S3 CORS
              - !Sub 'https://${DomainName}'
            MaxAge: 3000
      LoggingConfiguration:
        DestinationBucketName: !Ref LogBucket
        LogFilePrefix: s3-access-logs/

  LogBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub forensicbridge-logs-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt MigrationEncryptionKey.Arn
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldLogs
            Status: Enabled
            ExpirationInDays: 365

  # ============================================================================
  # RDS POSTGRESQL (Production-Ready)
  # ============================================================================
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnet group for ForensicBridge RDS
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2

  Database:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub forensicbridge-${Environment}
      DBInstanceClass: db.t3.small
      Engine: postgres
      EngineVersion: '15'
      MasterUsername: forensicbridge
      # AUDIT FIX CRIT-03: Retrieve password from Secrets Manager instead of stack parameter
      MasterUserPassword: !Sub '{{resolve:secretsmanager:forensicbridge/${Environment}/db:SecretString:password}}'
      AllocatedStorage: 50
      MaxAllocatedStorage: 200
      StorageType: gp3
      StorageEncrypted: true
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !Ref RDSSecurityGroup
      # AUDIT FIX HIGH-01: Enable Multi-AZ for high availability
      MultiAZ: true
      BackupRetentionPeriod: 7
      PreferredBackupWindow: '03:00-04:00'
      PreferredMaintenanceWindow: 'sun:04:00-sun:05:00'
      DeletionProtection: true
      PubliclyAccessible: false
      EnablePerformanceInsights: true
      PerformanceInsightsRetentionPeriod: 7
      MonitoringInterval: 60
      MonitoringRoleArn: !GetAtt RDSMonitoringRole.Arn
      EnableCloudwatchLogsExports:
        - postgresql

  RDSMonitoringRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: monitoring.rds.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonRDSEnhancedMonitoringRole

  # ============================================================================
  # ELASTICACHE REDIS (Celery Broker)
  # ============================================================================
  RedisSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      Description: Subnet group for Redis
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2

  # FIX AWS-04: Use Replication Group for encryption in transit support
  RedisReplicationGroup:
    Type: AWS::ElastiCache::ReplicationGroup
    Properties:
      ReplicationGroupId: !Sub fb-${Environment}-redis
      ReplicationGroupDescription: ForensicBridge Redis with encryption
      CacheNodeType: cache.t3.micro
      Engine: redis
      NumCacheClusters: 1
      CacheSubnetGroupName: !Ref RedisSubnetGroup
      SecurityGroupIds:
        - !Ref RedisSecurityGroup
      # FIX AWS-04: Enable encryption in transit and at rest
      TransitEncryptionEnabled: true
      AtRestEncryptionEnabled: true
      # FIX: Add AuthToken for Redis authentication (required when TransitEncryptionEnabled=true)
      AuthToken: !Sub '{{resolve:secretsmanager:forensicbridge/${Environment}/redis:SecretString:auth_token}}'
      AutomaticFailoverEnabled: false
      SnapshotRetentionLimit: 7
      SnapshotWindow: '03:00-05:00'

  # ============================================================================
  # EC2 INSTANCE (API Server + Worker)
  # ============================================================================
  EC2Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Policies:
        - PolicyName: ForensicBridgeS3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt MigrationBucket.Arn
                  - !Sub '${MigrationBucket.Arn}/*'
        - PolicyName: ForensicBridgeSecretsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:forensicbridge/*'
        - PolicyName: ForensicBridgeKMSAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - kms:Encrypt
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource: !GetAtt MigrationEncryptionKey.Arn
                Condition:
                  StringEquals:
                    'kms:ViaService': !Sub 's3.${AWS::Region}.amazonaws.com'

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref EC2Role

  # MED-16 FIX: Use SSM Parameter for region-agnostic AMI lookup
  LatestUbuntuAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/22.04/stable/current/amd64/hvm/ebs-gp2/ami-id

  EC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.small
      # MED-16 FIX: Use SSM parameter instead of hardcoded us-east-1 AMI
      ImageId: !Ref LatestUbuntuAmi
      SubnetId: !Ref PublicSubnet1
      SecurityGroupIds:
        - !Ref EC2SecurityGroup
      IamInstanceProfile: !Ref EC2InstanceProfile
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 30
            VolumeType: gp3
            Encrypted: true
      UserData:
        # CRIT-10 FIX: Retrieve secrets from Secrets Manager at runtime instead of embedding in UserData
        Fn::Base64: !Sub |
          #!/bin/bash
          apt-get update
          apt-get install -y python3.11 python3-pip redis-tools postgresql-client nginx awscli jq
          pip3 install flask celery gunicorn redis psycopg2-binary boto3

          # Create app directory
          mkdir -p /opt/forensicbridge

          # CRIT-10 FIX: Create startup script that retrieves secrets from Secrets Manager
          cat > /opt/forensicbridge/load_secrets.sh <<'SCRIPT'
          #!/bin/bash
          # Retrieve database password from Secrets Manager at runtime
          SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id forensicbridge/production --query SecretString --output text --region ${AWS::Region})
          if [ $? -ne 0 ]; then
            echo "ERROR: Failed to retrieve secrets from Secrets Manager"
            exit 1
          fi

          DB_PASSWORD=$(echo "$SECRET_JSON" | jq -r '.database_password')
          REDIS_TOKEN=$(aws secretsmanager get-secret-value --secret-id forensicbridge/${Environment}/redis --query SecretString --output text --region ${AWS::Region} | jq -r '.auth_token')

          # Set environment variables (never write password to disk)
          export FLASK_ENV=production
          export DATABASE_URL="postgresql://forensicbridge:$DB_PASSWORD@${Database.Endpoint.Address}:5432/forensicbridge"
          export REDIS_URL="rediss://:$REDIS_TOKEN@${RedisReplicationGroup.PrimaryEndPoint.Address}:6379"
          export AWS_S3_BUCKET="${MigrationBucket}"
          export SECRETS_MANAGER_NAME="forensicbridge/production"

          # Start application with secrets in environment
          exec "$@"
          SCRIPT

          chmod +x /opt/forensicbridge/load_secrets.sh

          # Create env file with non-sensitive config only
          cat > /opt/forensicbridge/.env <<EOF
          FLASK_ENV=production
          # REDIS_URL set at runtime via load_secrets.sh (contains auth token)
          AWS_S3_BUCKET=${MigrationBucket}
          SECRETS_MANAGER_NAME=forensicbridge/production
          AWS_REGION=${AWS::Region}
          EOF

          echo "ForensicBridge server ready for deployment (secrets loaded at runtime)"
      Tags:
        - Key: Name
          Value: !Sub forensicbridge-${Environment}-server

  # ============================================================================
  # APPLICATION LOAD BALANCER (with HTTPS)
  # ============================================================================
  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub forensicbridge-${Environment}
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      SecurityGroups:
        - !Ref ALBSecurityGroup
      Scheme: internet-facing

  WebACLAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !Ref ALB
      WebACLArn: !GetAtt WebACL.Arn

  ALBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub forensicbridge-${Environment}-tg
      Port: 5000
      Protocol: HTTP
      VpcId: !Ref VPC
      HealthCheckPath: /api/health
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetType: instance
      Targets:
        - Id: !Ref EC2Instance
          Port: 5000

  ALBHTTPListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: "443"
            StatusCode: HTTP_301

  ALBHTTPSListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref CertificateArn
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ALBTargetGroup

  # ============================================================================
  # CLOUDWATCH ALARMS
  # ============================================================================
  HighCPUAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub forensicbridge-${Environment}-high-cpu
      AlarmDescription: EC2 CPU utilization above 80%
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 2
      MetricName: CPUUtilization
      Namespace: AWS/EC2
      Period: 300
      Statistic: Average
      Threshold: 80
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic
      OKActions:
        - !Ref AlarmNotificationTopic
      Dimensions:
        - Name: InstanceId
          Value: !Ref EC2Instance

  DatabaseConnectionsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub forensicbridge-${Environment}-db-connections
      AlarmDescription: RDS connections above 50
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 2
      MetricName: DatabaseConnections
      Namespace: AWS/RDS
      Period: 300
      Statistic: Average
      Threshold: 50
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic
      OKActions:
        - !Ref AlarmNotificationTopic
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref Database

  ALB5xxErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub forensicbridge-${Environment}-alb-5xx
      AlarmDescription: ALB 5xx errors above threshold
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 1
      MetricName: HTTPCode_ELB_5XX_Count
      Namespace: AWS/ApplicationELB
      Period: 300
      Statistic: Sum
      Threshold: 10
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic
      OKActions:
        - !Ref AlarmNotificationTopic
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt ALB.LoadBalancerFullName

  # FIX AWS-02: Additional critical CloudWatch alarms
  DatabaseFreeStorageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub forensicbridge-${Environment}-db-storage
      AlarmDescription: RDS free storage space below 5GB
      ComparisonOperator: LessThanThreshold
      EvaluationPeriods: 1
      MetricName: FreeStorageSpace
      Namespace: AWS/RDS
      Period: 300
      Statistic: Average
      Threshold: 5368709120  # 5GB in bytes
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic
      OKActions:
        - !Ref AlarmNotificationTopic
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref Database

  DatabaseCPUAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub forensicbridge-${Environment}-db-cpu
      AlarmDescription: RDS CPU utilization above 80%
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 2
      MetricName: CPUUtilization
      Namespace: AWS/RDS
      Period: 300
      Statistic: Average
      Threshold: 80
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic
      OKActions:
        - !Ref AlarmNotificationTopic
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref Database

  WAFBlockedRequestsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub forensicbridge-${Environment}-waf-blocked
      AlarmDescription: High number of WAF blocked requests (potential attack)
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 1
      MetricName: BlockedRequests
      Namespace: AWS/WAFV2
      Period: 300
      Statistic: Sum
      Threshold: 1000
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic
      OKActions:
        - !Ref AlarmNotificationTopic
      Dimensions:
        - Name: WebACL
          Value: !Sub forensicbridge-${Environment}-waf
        - Name: Region
          Value: !Ref AWS::Region
        - Name: Rule
          Value: ALL

  TargetResponseTimeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub forensicbridge-${Environment}-response-time
      AlarmDescription: Target response time above 2 seconds
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 3
      MetricName: TargetResponseTime
      Namespace: AWS/ApplicationELB
      Period: 60
      Statistic: Average
      Threshold: 2
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic
      OKActions:
        - !Ref AlarmNotificationTopic
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt ALB.LoadBalancerFullName
        - Name: TargetGroup
          Value: !GetAtt ALBTargetGroup.TargetGroupFullName

  UnhealthyHostAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub forensicbridge-${Environment}-unhealthy-hosts
      AlarmDescription: Unhealthy hosts in target group
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 1
      MetricName: UnHealthyHostCount
      Namespace: AWS/ApplicationELB
      Period: 60
      Statistic: Maximum
      Threshold: 0
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic
      OKActions:
        - !Ref AlarmNotificationTopic
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt ALB.LoadBalancerFullName
        - Name: TargetGroup
          Value: !GetAtt ALBTargetGroup.TargetGroupFullName

  # ============================================================================
  # AUDIT FIX HIGH-02: VPC FLOW LOGS
  # ============================================================================
  VPCFlowLogRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: vpc-flow-logs.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: VPCFlowLogPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                Resource:
                  - !GetAtt VPCFlowLogGroup.Arn
                  - !Sub '${VPCFlowLogGroup.Arn}:*'

  VPCFlowLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/vpc/forensicbridge-${Environment}
      RetentionInDays: 365

  VPCFlowLog:
    Type: AWS::EC2::FlowLog
    Properties:
      DeliverLogsPermissionArn: !GetAtt VPCFlowLogRole.Arn
      LogGroupName: !Ref VPCFlowLogGroup
      ResourceId: !Ref VPC
      ResourceType: VPC
      TrafficType: ALL

  # ============================================================================
  # AUDIT FIX HIGH-02: CLOUDTRAIL
  # ============================================================================
  CloudTrailBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub forensicbridge-cloudtrail-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt MigrationEncryptionKey.Arn
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldTrailLogs
            Status: Enabled
            ExpirationInDays: 365

  CloudTrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CloudTrailBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AWSCloudTrailAclCheck
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt CloudTrailBucket.Arn
          - Sid: AWSCloudTrailWrite
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${CloudTrailBucket.Arn}/AWSLogs/${AWS::AccountId}/*'
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control

  CloudTrail:
    Type: AWS::CloudTrail::Trail
    DependsOn: CloudTrailBucketPolicy
    Properties:
      TrailName: !Sub forensicbridge-${Environment}-trail
      IsLogging: true
      S3BucketName: !Ref CloudTrailBucket
      EnableLogFileValidation: true
      IncludeGlobalServiceEvents: true
      # M-17 FIX: Multi-region trail captures events from all AWS regions,
      # preventing blind spots for cross-region security events
      IsMultiRegionTrail: true

  # ============================================================================
  # AUDIT FIX: SNS TOPIC FOR ALARM NOTIFICATIONS
  # ============================================================================
  AlarmNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub forensicbridge-${Environment}-alarms
      DisplayName: ForensicBridge Alarms

  # ADV-04: SNS email subscription for alarm notifications
  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlarmNotificationTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # ============================================================================
  # AUDIT FIX HIGH-01: AUTO SCALING GROUP
  # ============================================================================
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub forensicbridge-${Environment}-lt
      LaunchTemplateData:
        InstanceType: t3.small
        ImageId: !Ref LatestUbuntuAmi
        SecurityGroupIds:
          - !Ref EC2SecurityGroup
        IamInstanceProfile:
          Arn: !GetAtt EC2InstanceProfile.Arn
        BlockDeviceMappings:
          - DeviceName: /dev/sda1
            Ebs:
              VolumeSize: 30
              VolumeType: gp3
              Encrypted: true
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            apt-get update
            apt-get install -y python3.11 python3-pip redis-tools postgresql-client nginx awscli jq
            pip3 install flask celery gunicorn redis psycopg2-binary boto3
            mkdir -p /opt/forensicbridge
            cat > /opt/forensicbridge/load_secrets.sh <<'SCRIPT'
            #!/bin/bash
            SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id forensicbridge/production --query SecretString --output text --region ${AWS::Region})
            if [ $? -ne 0 ]; then
              echo "ERROR: Failed to retrieve secrets from Secrets Manager"
              exit 1
            fi
            DB_PASSWORD=$(echo "$SECRET_JSON" | jq -r '.database_password')
            REDIS_TOKEN=$(aws secretsmanager get-secret-value --secret-id forensicbridge/${Environment}/redis --query SecretString --output text --region ${AWS::Region} | jq -r '.auth_token')
            export FLASK_ENV=production
            export DATABASE_URL="postgresql://forensicbridge:$DB_PASSWORD@${Database.Endpoint.Address}:5432/forensicbridge"
            export REDIS_URL="rediss://:$REDIS_TOKEN@${RedisReplicationGroup.PrimaryEndPoint.Address}:6379"
            export AWS_S3_BUCKET="${MigrationBucket}"
            export SECRETS_MANAGER_NAME="forensicbridge/production"
            exec "$@"
            SCRIPT
            chmod +x /opt/forensicbridge/load_secrets.sh
            echo "ForensicBridge server ready"

  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: !Sub forensicbridge-${Environment}-asg
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      MinSize: 2
      MaxSize: 4
      DesiredCapacity: 2
      # M-19 FIX: Place instances in private subnets to reduce attack surface.
      # ALB in public subnets handles internet-facing traffic; instances
      # reach the internet via NAT Gateway for package updates only.
      VPCZoneIdentifier:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      TargetGroupARNs:
        - !Ref ALBTargetGroup
      HealthCheckType: ELB
      HealthCheckGracePeriod: 300
      Tags:
        - Key: Name
          Value: !Sub forensicbridge-${Environment}-server
          PropagateAtLaunch: true

  # ============================================================================
  # LAMBDA CLEANUP FUNCTION WITH DLQ
  # ============================================================================
  CleanupDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub forensicbridge-${Environment}-cleanup-dlq
      MessageRetentionPeriod: 1209600  # 14 days

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CleanupLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:TerminateInstances
                Resource: '*'
              - Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt MigrationBucket.Arn
                  - !Sub '${MigrationBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt CleanupDLQ.Arn

  CleanupFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub qb-migration-${Environment}-cleanup
      Runtime: python3.11
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 300
      DeadLetterConfig:
        TargetArn: !GetAtt CleanupDLQ.Arn
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          S3_BUCKET: !Ref MigrationBucket
      Code:
        ZipFile: |
          def handler(event, context):
              """Placeholder - deploy actual cleanup logic separately."""
              return {"statusCode": 200}

# ============================================================================
# OUTPUTS
# ============================================================================
Outputs:
  ALBDNS:
    Description: ALB DNS name (point your domain here)
    Value: !GetAtt ALB.DNSName
    Export:
      Name: !Sub ${AWS::StackName}-ALB-DNS

  S3Bucket:
    Description: S3 bucket for migration data
    Value: !Ref MigrationBucket
    Export:
      Name: !Sub ${AWS::StackName}-S3-Bucket

  DatabaseEndpoint:
    Description: RDS PostgreSQL endpoint
    Value: !GetAtt Database.Endpoint.Address
    Export:
      Name: !Sub ${AWS::StackName}-DB-Endpoint

  RedisEndpoint:
    Description: ElastiCache Redis endpoint
    Value: !GetAtt RedisReplicationGroup.PrimaryEndPoint.Address
    Export:
      Name: !Sub ${AWS::StackName}-Redis-Endpoint

  EC2PublicIP:
    Description: EC2 instance public IP
    Value: !GetAtt EC2Instance.PublicIp
    Export:
      Name: !Sub ${AWS::StackName}-EC2-IP

  WebACLArn:
    Description: WAF Web ACL ARN
    Value: !GetAtt WebACL.Arn
    Export:
      Name: !Sub ${AWS::StackName}-WAF-ARN
