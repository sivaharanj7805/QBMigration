# Ruff linting configuration for ForensicBridge Python code
target-version = "py311"
line-length = 120

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
ignore = [
    "S101",  # assert used (ok in tests)
    "S603",  # subprocess call (needed for some operations)
    "B008",  # function call in default argument (common in Flask/FastAPI)
]

[lint.per-file-ignores]
"**/tests/**" = ["S101", "S106"]  # allow assert and hardcoded passwords in tests
"test_*.py" = ["S101", "S106"]
