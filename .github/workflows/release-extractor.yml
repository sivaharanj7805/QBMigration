# GitHub Actions workflow to build and release QBExtractor
# Triggers on tags matching v* pattern (e.g., v4.4.0)

name: Build and Release QBExtractor

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 4.4.0)'
        required: true
        default: '4.4.0'

env:
  DOTNET_VERSION: '8.0.x'
  PROJECT_PATH: 'QBDesktopReader/QBDesktopReader.csproj'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Get version from tag or input
      id: version
      shell: pwsh
      env:
        EVENT_NAME: ${{ github.event_name }}
        INPUT_VERSION: ${{ github.event.inputs.version }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        if ($env:EVENT_NAME -eq "workflow_dispatch") {
          $version = $env:INPUT_VERSION
        } else {
          $version = $env:REF_NAME.TrimStart('v')
        }
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
        echo "Building version: $version"

    - name: Restore dependencies
      run: dotnet restore ${{ env.PROJECT_PATH }}

    - name: Build Release (x86)
      run: |
        dotnet publish ${{ env.PROJECT_PATH }} `
          -c Release `
          -r win-x86 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:Version=${{ steps.version.outputs.VERSION }} `
          -o ./publish/x86

    - name: Build Release (x64)
      run: |
        dotnet publish ${{ env.PROJECT_PATH }} `
          -c Release `
          -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:Version=${{ steps.version.outputs.VERSION }} `
          -o ./publish/x64

    - name: Rename executables
      shell: pwsh
      run: |
        # Rename for clarity
        Move-Item ./publish/x86/QBDesktopReader.exe ./publish/QBExtractor.exe -Force
        Move-Item ./publish/x64/QBDesktopReader.exe ./publish/QBExtractor-x64.exe -Force

        # Show file info
        Get-ChildItem ./publish/*.exe | ForEach-Object {
          Write-Host "$($_.Name): $([math]::Round($_.Length / 1MB, 2)) MB"
        }

    - name: Calculate checksums
      shell: pwsh
      run: |
        $files = Get-ChildItem ./publish/*.exe
        $checksums = @()
        foreach ($file in $files) {
          $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash
          $checksums += "$hash  $($file.Name)"
          Write-Host "$($file.Name): $hash"
        }
        $checksums | Out-File ./publish/checksums.txt -Encoding UTF8

    - name: Copy installer scripts
      shell: pwsh
      run: |
        Copy-Item QBMigrationServer/static/extractor/ForensicBridge_Install.bat ./publish/ -Force
        Copy-Item QBMigrationServer/static/extractor/ForensicBridge_Bootstrap.ps1 ./publish/ -Force -ErrorAction SilentlyContinue

    - name: Create Release
      uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
      with:
        name: QBExtractor v${{ steps.version.outputs.VERSION }}
        tag_name: v${{ steps.version.outputs.VERSION }}
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          ./publish/QBExtractor.exe
          ./publish/QBExtractor-x64.exe
          ./publish/ForensicBridge_Install.bat
          ./publish/checksums.txt
        body: |
          ## QBExtractor v${{ steps.version.outputs.VERSION }}

          ### Downloads
          - **QBExtractor.exe** - 32-bit version (recommended for QuickBooks compatibility)
          - **QBExtractor-x64.exe** - 64-bit version
          - **ForensicBridge_Install.bat** - One-click installer

          ### Installation
          1. Download `ForensicBridge_Install.bat`
          2. Right-click and "Run as Administrator"
          3. Follow the prompts

          Or download `QBExtractor.exe` directly and run it.

          ### Requirements
          - Windows 10 or later
          - QuickBooks Desktop installed and open
          - One of:
            - QuickBooks SDK (QBFC16) - **Recommended**
            - QODBC Driver (fallback option)

          ### What's New
          - Multi-backend support (QBFC + QODBC fallback)
          - Automatic backend detection
          - Improved error handling with retry logic
          - Better installation experience

          ### Checksums
          See `checksums.txt` for SHA256 verification.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: QBExtractor-${{ steps.version.outputs.VERSION }}
        path: ./publish/
        retention-days: 30
