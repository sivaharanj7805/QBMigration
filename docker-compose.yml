# =============================================================================
# QBMigration Docker Compose Configuration
# =============================================================================
#
# Usage:
#   Development: docker-compose up -d
#   Production:  docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   Testing:     docker-compose -f docker-compose.yml -f docker-compose.test.yml up -d
#
# NOTE: version key removed - deprecated in Docker Compose v2+
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # QBMigration Server (Flask API)
  # ---------------------------------------------------------------------------
  server:
    build:
      context: .
      target: production
    container_name: qbmigration-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./QBMigrationServer:/app/QBMigrationServer:ro
      - ./QBMigrationService:/app/QBMigrationService:ro
      - qbmigration-data:/app/data
      - qbmigration-logs:/app/logs
    environment:
      - FLASK_APP=QBMigrationServer/app.py
      - FLASK_ENV=${FLASK_ENV:-development}
      # SECURITY FIX: Debug disabled by default; override in docker-compose.dev.yml
      - FLASK_DEBUG=${FLASK_DEBUG:-0}
      # SECURITY FIX: Use environment variables for all secrets - fail if not set
      - DATABASE_URL=postgresql://${POSTGRES_USER:-qbmigration}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_required}@postgres:5432/${POSTGRES_DB:-qbmigration}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD_required}@redis:6379/0
      # FIX: extensions.py checks RATELIMIT_STORAGE_URL at import time — must match REDIS_URL
      - RATELIMIT_STORAGE_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD_required}@redis:6379/1
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY_required}
      - AWS_REGION=${AWS_REGION:-ca-central-1}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - QBO_CLIENT_ID=${QBO_CLIENT_ID:-}
      - QBO_CLIENT_SECRET=${QBO_CLIENT_SECRET:-}
      - QBO_ENVIRONMENT=${QBO_ENVIRONMENT:-sandbox}
      - BACKUP_ENCRYPTION_KEY=${BACKUP_ENCRYPTION_KEY:-}
      - ENCRYPTION_PASSWORD=${ENCRYPTION_PASSWORD:-}
      # Email (AWS SES SMTP or any SMTP relay)
      - MAIL_SERVER=${MAIL_SERVER:-email-smtp.ca-central-1.amazonaws.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_DEFAULT_SENDER=${MAIL_DEFAULT_SENDER:-noreply@qbmigrate.io}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        # FIX I-07: Wait for Redis healthcheck before starting server
        condition: service_healthy
    # AUDIT FIX: Resource limits to prevent any container from exhausting host resources
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      # FIX: Gunicorn with 4 workers needs time to boot — each worker runs
      # create_app() with DB migrations, AWS checks, SocketIO init, etc.
      start_period: 60s
    networks:
      - qbmigration-network

  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: qbmigration-postgres
    restart: unless-stopped
    # SECURITY FIX: Only expose to localhost by default, use POSTGRES_EXPOSE_PORT for custom binding
    ports:
      - "${POSTGRES_EXPOSE_PORT:-127.0.0.1:5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      # SECURITY FIX: Use environment variables - never hardcode passwords
      - POSTGRES_USER=${POSTGRES_USER:-qbmigration}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_required}
      - POSTGRES_DB=${POSTGRES_DB:-qbmigration}
      - PGDATA=/var/lib/postgresql/data/pgdata
    healthcheck:
      # PRODUCTION FIX: Use environment variables for username and database
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qbmigration} -d ${POSTGRES_DB:-qbmigration}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - qbmigration-network

  # ---------------------------------------------------------------------------
  # Redis (for caching and rate limiting)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: qbmigration-redis
    restart: unless-stopped
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD_required}
    # SECURITY FIX: Bind Redis to localhost only to prevent external access
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis-data:/data
    # SECURITY FIX: Add password authentication to Redis
    # CRITICAL FIX: Require REDIS_PASSWORD - no empty default allowed in production
    # AUDIT FIX HIGH-18: Docker Compose variable substitution enforces password is set;
    # password complexity (min 16 chars) should be enforced via .env validation or CI checks.
    # Generate a strong password with: openssl rand -base64 24
    # FIX: Use config file instead of CLI args to avoid password in process list (ps aux)
    command: |
      sh -c 'echo "appendonly yes
      maxmemory 256mb
      maxmemory-policy noeviction
      requirepass $${REDIS_PASSWORD}" > /tmp/redis.conf && redis-server /tmp/redis.conf'
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      # SECURITY FIX: Don't expose password in process list - use shell to hide it
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping 2>/dev/null | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qbmigration-network

  # ---------------------------------------------------------------------------
  # Celery Worker (for background tasks)
  # ---------------------------------------------------------------------------
  celery-worker:
    build:
      context: .
      target: production
    container_name: qbmigration-celery-worker
    restart: unless-stopped
    command: celery -A QBMigrationServer.celery_worker worker --loglevel=info --concurrency=4
    volumes:
      - ./QBMigrationServer:/app/QBMigrationServer:ro
      - ./QBMigrationService:/app/QBMigrationService:ro
      - qbmigration-data:/app/data
      - qbmigration-logs:/app/logs
    environment:
      # SECURITY FIX: Use environment variables - never hardcode credentials
      - DATABASE_URL=postgresql://${POSTGRES_USER:-qbmigration}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_required}@postgres:5432/${POSTGRES_DB:-qbmigration}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD_required}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY_required}
      - AWS_REGION=${AWS_REGION:-ca-central-1}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-}
      - QBO_CLIENT_ID=${QBO_CLIENT_ID:-}
      - QBO_CLIENT_SECRET=${QBO_CLIENT_SECRET:-}
    depends_on:
      - postgres
      - redis
    networks:
      - qbmigration-network

  # ---------------------------------------------------------------------------
  # Celery Beat (for scheduled tasks)
  # ---------------------------------------------------------------------------
  celery-beat:
    build:
      context: .
      target: production
    container_name: qbmigration-celery-beat
    restart: unless-stopped
    command: celery -A QBMigrationServer.celery_worker beat --loglevel=info
    volumes:
      - ./QBMigrationServer:/app/QBMigrationServer:ro
      - celery-schedule:/app/celerybeat-schedule
    environment:
      # FIX I-06: Include all required env vars (matching celery-worker)
      - DATABASE_URL=postgresql://${POSTGRES_USER:-qbmigration}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_required}@postgres:5432/${POSTGRES_DB:-qbmigration}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD_required}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY_required}
      - AWS_REGION=${AWS_REGION:-ca-central-1}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-}
      - BACKUP_ENCRYPTION_KEY=${BACKUP_ENCRYPTION_KEY:-}
    depends_on:
      - postgres
      - redis
    networks:
      - qbmigration-network

  # ---------------------------------------------------------------------------
  # Frontend (Next.js Dashboard)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./forensicbridge-dashboard
      dockerfile: Dockerfile
    container_name: qbmigration-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:5000
      - NEXT_PUBLIC_CSP_CONNECT_DOMAINS=http://localhost:5000 http://localhost:3000
    depends_on:
      server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - qbmigration-network

  # ---------------------------------------------------------------------------
  # Nginx (reverse proxy, optional)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: qbmigration-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - server
    profiles:
      - production
    networks:
      - qbmigration-network

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  qbmigration-data:
    driver: local
  qbmigration-logs:
    driver: local
  celery-schedule:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  qbmigration-network:
    driver: bridge
