[pytest]
# =============================================================================
# Pytest Configuration for QBMigration Server
# =============================================================================
# Run tests: pytest
# With coverage: pytest --cov
# HTML report: pytest --cov --cov-report=html
# =============================================================================

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum version
minversion = 7.0

# Output verbosity
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=.
    --cov-report=term-missing
    --cov-report=html:coverage_html
    --cov-report=xml:coverage.xml
    --cov-fail-under=70

# Test markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    security: marks tests as security tests
    requires_aws: marks tests that require AWS credentials
    requires_redis: marks tests that require Redis
    requires_db: marks tests that require database

# Logging
log_cli = true
log_cli_level = WARNING
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning

# Timeout for tests (requires pytest-timeout)
timeout = 300

# Parallel execution (requires pytest-xdist)
# Use: pytest -n auto
